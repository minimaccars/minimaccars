<svg xmlns="http://www.w3.org/2000/svg" width="800" height="190" viewBox="0 0 800 190" role="img">
  <title>minimaccars GitHub stats and languages by repository count</title>
  <desc>☆  Total Stars Earned: 0. ◷  Total Commits (last year): 10. ⑂  Total PRs: 0. ⓘ  Total Issues: 1. ◇  Repos contributed to recently: 1.</desc>
  <rect width="800" height="190" rx="8" fill="#0d1117"/>
  <clipPath id="bar"><rect x="450" y="47" width="320" height="8" rx="4"/></clipPath>
  <g font-family="Segoe UI,Arial,sans-serif">
    <g fill="#a78bfa" font-size="16" font-weight="600">
      <text x="24" y="28">minimaccars GitHub Stats</text>
